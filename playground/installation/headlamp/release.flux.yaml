apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp-charts
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  timeout: 3m
  releaseName: headlamp
  targetNamespace: kube-system
  chart:
    spec:
      chart: headlamp
      version: '0.46.0'
      sourceRef:
        kind: HelmRepository
        name: headlamp-charts
      interval: 24h
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  driftDetection:
    mode: enabled
  values:
    # Only for the disposable playground, reached through localhost or private Tailscale.
    # All visitors share the limited demo identity. Never expose this on a public URL.
    fullnameOverride: headlamp
    config:
      unsafeUseServiceAccountToken: true
      pluginsDir: /headlamp/plugins
    clusterRoleBinding:
      create: false
    serviceAccount:
      name: headlamp
    volumes:
      - name: local-plugin
        hostPath:
          path: /opt/change-windows-plugins
          type: Directory
    volumeMounts:
      - name: local-plugin
        mountPath: /headlamp/plugins
        readOnly: true
