apiVersion: addons.projectcapsule.dev/v1alpha1
kind: ChangeWindow
metadata:
  name: after-hours
  labels:
    company.com/consumer: "tenants"
spec:
  namespaceSelectors:
    - matchLabels:
        environment: development
  schedules:
    - name: every-night
      cron: "0 19 * * *"
      timeZone: Europe/Zurich
      duration: 12h
  serviceAccount:
    namespace: schedule-action-controller-system
    name: after-hours-executor
  targets:
    - name: deployments
      apiVersion: apps/v1
      kind: Deployment
    - name: statefulsets
      apiVersion: apps/v1
      kind: StatefulSet
  actions:
    - name: sleep-and-resume
      targets: [deployments, statefulsets]
      capture:
        replicas:
          subresource: scale
          path: /spec/replicas
      onStart:
        apply:
          subresource: scale
          force: true
          template: |
            spec:
              replicas: 0
      onEnd:
        apply:
          subresource: scale
          template: |-
            spec:
              replicas: {{ .captured.replicas }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: after-hours-executor
  namespace: schedule-action-controller-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: impersonate-after-hours-executor
  namespace: schedule-action-controller-system
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [after-hours-executor]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: impersonate-after-hours-executor
  namespace: schedule-action-controller-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: impersonate-after-hours-executor
subjects:
  - kind: ServiceAccount
    name: schedule-action-controller-controller-manager
    namespace: schedule-action-controller-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: after-hours-scale
  namespace: development
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: after-hours-scale
  namespace: development
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: after-hours-scale
subjects:
  - kind: ServiceAccount
    name: after-hours-executor
    namespace: schedule-action-controller-system
